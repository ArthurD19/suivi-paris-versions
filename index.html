<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1020">
  <script>
    /* Le thème choisi (clair, sombre), appliqué avant l'affichage ; sans choix, celui du système. */
    try { const t = localStorage.getItem("theme"); if (t === "clair" || t === "sombre") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suivi Paris">
  <title>Suivi Paris</title>
  <link rel="icon" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="cadre">
    <nav class="rail" aria-label="Navigation principale">
      <a class="marque" href="#/tableau" aria-label="Suivi Paris, tableau de bord">
        <img src="icone.png" alt="" width="40" height="40">
        <span>Suivi<br>Paris</span>
      </a>
      <ul class="menu">
        <li><a href="#/tableau" data-page="tableau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/><path d="M3 21h18"/></svg><span>Tableau de bord</span></a></li>
        <li><a href="#/paris" data-page="paris"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Mes paris</span></a></li>
        <li><a href="#/soldes" data-page="soldes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 14.5h2"/><path d="M7 6l9-3 1.5 3"/></svg><span>Soldes</span></a></li>
        <li><a href="#/importer" data-page="importer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg><span>Importer</span></a></li>
        <li><a href="#/comptes" data-page="comptes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg><span>Comptes</span></a></li>
        <li><a href="#/donnees" data-page="donnees"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Mes données</span></a></li>
      </ul>
      <button class="theme" id="theme" type="button" title="Thème : celui du système">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
        <span>Auto</span>
      </button>
      <button class="quitter" id="quitter" type="button" title="Arrêter Suivi Paris">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>
        <span>Quitter</span>
      </button>
    </nav>
    <div class="colonne">
      <nav class="barre-books" id="menu-books" aria-label="Bookmakers" hidden></nav>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="vendor/echarts.min.js"></script>
  <script src="pyodide/pyodide.js"></script>
  <script src="mobile.js"></script>
  <script src="app.js"></script>
</body>
</html>
